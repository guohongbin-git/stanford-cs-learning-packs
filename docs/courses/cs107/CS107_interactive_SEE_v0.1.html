Undefined Behavior", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "C语言标准未规定执行结果的程序行为。", "why": "理解编译器优化与程序可靠性的关系。", "failure_conditions": ["依赖未定义行为会导致不同编译器结果不同。"], "example": "访问释放后的指针产生不可预测结果。", "relations": [{"kind": "enables", "target": "Compiler Optimization"}, {"kind": "related_to", "target": "Compiler Optimization"}], "weeks": ["w6"], "source_weeks": ["w6"]}, "Compiler Optimization": {"id": "Compiler Optimization", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "编译器自动改变代码实现以提高执行效率的技术。", "why": "理解源码和机器代码差异。", "failure_conditions": ["假设变量永远按源码顺序执行会产生错误。"], "example": "开启-O2优化观察生成代码变化。", "relations": [{"kind": "enables", "target": "Linking"}, {"kind": "related_to", "target": "Linking"}], "weeks": ["w6"], "source_weeks": ["w6"]}, "Linking": {"id": "Linking", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "将多个目标文件和库组合成可执行程序的过程。", "why": "解释大型程序构建过程。", "failure_conditions": ["符号解析失败会导致链接错误。"], "example": "链接多个C文件生成最终程序。", "relations": [{"kind": "enables", "target": "Generic Linear Search"}, {"kind": "related_to", "target": "Generic Linear Search"}], "weeks": ["w6"], "source_weeks": ["w6"]}, "Object File": {"id": "Object File", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "保存编译后机器代码、符号和重定位信息的文件格式。", "why": "连接源码编译和链接阶段。", "failure_conditions": ["错误理解符号表会阻碍调试。"], "example": "使用objdump查看.o文件内容。", "relations": [{"kind": "enables", "target": "Virtual Memory"}], "weeks": ["w7"], "source_weeks": ["w7"]}, "Virtual Memory": {"id": "Virtual Memory", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "通过地址转换和分页提供隔离抽象内存空间的机制。", "why": "支持现代操作系统资源管理。", "failure_conditions": ["错误理解虚拟地址会误判物理存储位置。"], "example": "进程访问虚拟地址由页表转换。", "relations": [{"kind": "enables", "target": "Process Address Space"}, {"kind": "related_to", "target": "Process Address Space"}], "weeks": ["w8"], "source_weeks": ["w8"]}, "Process Address Space": {"id": "Process Address Space", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "每个进程独立拥有的虚拟内存区域。", "why": "解释进程隔离和资源管理。", "failure_conditions": ["跨进程直接访问地址会触发保护错误。"], "example": "分析程序代码段堆栈在地址空间的位置。", "relations": [{"kind": "enables", "target": "Threads and Concurrency"}, {"kind": "related_to", "target": "Threads and Concurrency"}], "weeks": ["w8"], "source_weeks": ["w8"]}, "Makefile": {"id": "Makefile", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "描述编译依赖和构建规则的自动化配置文件。", "why": "提高大型项目编译效率。", "failure_conditions": ["依赖关系遗漏会生成旧版本程序。"], "example": "使用Makefile管理多个C源文件编译。", "relations": [{"kind": "enables", "target": "Debugger"}, {"kind": "related_to", "target": "Debugger"}], "weeks": ["w9"], "source_weeks": ["w9"]}, "Debugger": {"id": "Debugger", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "用于观察程序状态、执行流程和变量变化的工具。", "why": "帮助定位运行错误。", "failure_conditions": ["只观察结果不分析状态变化会降低调试效率。"], "example": "使用gdb设置断点查看寄存器值。", "relations": [{"kind": "enables", "target": "Scheme and Functional Programming"}, {"kind": "related_to", "target": "Scheme and Functional Programming"}], "weeks": ["w9"], "source_weeks": ["w9"]}, "Threads and Concurrency": {"id": "Threads and Concurrency", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "操作系统中多个执行流共享CPU和资源并协调运行的机制", "why": "让多个执行流共享 CPU 与资源并协调运行", "failure_conditions": ["未同步访问共享内存会产生数据竞争"], "example": "编写多线程程序并用锁保护共享计数器", "relations": [{"kind": "enables", "target": "Makefile"}], "weeks": ["w8"], "source_weeks": ["w8"]}, "Scheme and Functional Programming": {"id": "Scheme and Functional Programming", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "以表达式求值和高阶函数为核心的函数式编程范式", "why": "用函数式范式理解递归、高阶函数与符号计算", "failure_conditions": ["递归设计错误会导致无限计算或栈增长"], "example": "使用Scheme递归处理列表结构", "relations": [{"kind": "enables", "target": "Python Interop"}, {"kind": "related_to", "target": "Python Interop"}], "weeks": ["w9"], "source_weeks": ["w9"]}, "Python Interop": {"id": "Python Interop", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "通过接口或绑定机制让C程序调用Python功能的技术", "why": "理解动态语言与 C 程序之间的桥接与数据转换", "failure_conditions": ["类型转换错误会导致接口调用失败"], "example": "用Python脚本调用C实现的数据处理函数", "relations": [], "weeks": ["w9"], "source_weeks": ["w9"]}, "Void Pointer and Generic Functions": {"id": "Void Pointer and Generic Functions", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "用 void* 传递任意类型地址以实现泛型函数，代价是丢失类型信息、依赖调用方保证正确解释。", "why": "C 语言泛型编程的基础手段（qsort、memcpy 均依赖它）。", "failure_conditions": ["用错类型解释 void* 指向的内存会静默产生错误结果而不报错"], "example": "实现可交换任意大小元素的泛型 swap，并按字节长度调用 memcpy", "relations": [{"kind": "enables", "target": "Memory Layout"}], "weeks": ["w4"], "source_weeks": ["w4"]}, "memcpy and memmove": {"id": "memcpy and memmove", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "按字节复制内存块；memmove 保证源与目标重叠时结果仍正确，memcpy 不保证。", "why": "区分两者是避免静默内存损坏的关键。", "failure_conditions": ["在重叠区间使用 memcpy 会破坏源数据导致复制结果不确定"], "example": "在数组中间插入元素时用 memmove 右移尾部区间", "relations": [{"kind": "enables", "target": "Undefined Behavior"}], "weeks": ["w5"], "source_weeks": ["w5"]}, "Generic Linear Search": {"id": "Generic Linear Search", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "传入元素大小与比较函数的线性查找实现，可作用于任意数据类型。", "why": "展示 C 语言如何用函数指针实现类型无关算法。", "failure_conditions": ["比较函数的参数语义（值 vs 指针）写错会得到错误匹配"], "example": "lsearch 遍历整型数组找出目标值并返回指向该元素的指针", "relations": [{"kind": "enables", "target": "Object File"}], "weeks": ["w6"], "source_weeks": ["w6"]}, "Activation Record Layout": {"id": "Activation Record Layout", "type": "Concept", "status": "TEACHING_RECONSTRUCTION", "definition": "函数调用时压入栈的参数、返回地址、保存的寄存器与局部变量的内存布局。", "why": "理解它才能解释递归如何展开、缓冲区溢出为何能改写返回地址。", "failure_conditions": ["写越界局部数组会覆盖保存的返回地址，导致跳转到非预期位置"], "example": "按 C 调用约定推演 factorial 递归调用时的栈帧变化", "relations": [{"kind": "enables", "target": "Pointer Arithmetic"}], "weeks": ["w3"], "source_weeks": ["w3"]}}}</script>
<script>

const DATA=JSON.parse(document.getElementById('cs107-data').textContent);const courseIR=DATA.course_ir;const conceptData=DATA.concepts;const quizzes=Object.fromEntries(courseIR.weeks.map(w=>[w.id,w.quiz]));
const storage=(()=>{try{const k='__cs336_probe__';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage}catch(e){return{getItem:()=>null,setItem:()=>{},removeItem:()=>{}}}})();let mode=storage.getItem('cs107-see-mode')||'human';let state=JSON.parse(storage.getItem('cs107-see-state')||'{}');for(const w of courseIR.weeks)if(!state[w.id])state[w.id]={status:'not_started',quiz:null};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function jesc(o){return esc(JSON.stringify(o,null,2))}
function conceptChip(name){return `<button class="chip concept-chip" data-concept="${esc(name)}">${esc(name)}</button>`}
function relButtons(c){return (c.relations||[]).map(r=>`<button class="chip concept-chip" data-concept="${esc(r.target)}" title="${esc(r.kind)}">${esc(r.target)}</button>`).join('')}
function renderNav(){const n=document.getElementById('nav');n.innerHTML=`<a href="#overview">课程总览</a><a href="#method">学习方法</a><a href="#knowledge-map">共享知识图</a>${courseIR.weeks.map(w=>`<a href="#${w.id}">${w.label} · ${esc(w.title)}</a>`).join('')}<a href="#synthesis">课程总收束</a>`}
function renderOverview(){return `<section class="slide hero" id="overview"><div><div class="eyebrow">FULL INTERACTIVE COURSE · SEE OFFICIAL · ARCHIVE OFFICIAL</div><h1>CS107:<br>Programming<br>Paradigms</h1><p class="lead">从位与字节到位运算、机器表示、汇编、栈帧、堆管理与虚存——用 C 语言建立“程序在机器上究竟如何运行”的系统级理解。本包绑定 SEE 官方公开录像。</p><div class="kpis"><div class="kpi"><div class="num">${Object.keys(conceptData).length}</div><div class="label">canonical concepts</div></div><div class="kpi"><div class="num">9</div><div class="label">教学周模块</div></div><div class="kpi"><div class="num">2</div><div class="label">Human / Agent View</div></div><div class="kpi"><div class="num">9</div><div class="label">周测打包</div></div></div><div class="note-card"><b>版本边界：</b>本包绑定 <b>SEE 官方 CS107</b>公开录像（archive_official，C 语言与系统层）。现行 CS107 的库与作业有更新；本包不混入新版内容。</div></div></section>`}
function renderMethod(){return `<section class="slide" id="method"><div class="eyebrow">HOW TO LEARN CS107</div><h2 class="section-title">不是背 API，而是能解释每条指令访问了哪块内存、代价是什么</h2><div class="intro-grid"><div class="card"><h3>1 · Representation</h3><p>从位模式理解整数、浮点、指针：任何数据结构最终都是字节与地址。</p></div><div class="card"><h3>2 · Execution</h3><p>跟踪函数调用：栈帧、参数传递、返回地址、寄存器约定，把 C 代码映射到汇编。</p></div><div class="card"><h3>3 · Systems</h3><p>理解堆、虚存与缓存如何决定程序行为与性能，并能用工具（debugger、valgrind 类方法）验证。</p></div></div><div class="course-map"><div class="card"><h3>Prerequisites</h3><p>CS106A/106B 级别编程基础，基本 C 语法。包内 quiz 用于自检，不替代官方 assignment。</p></div></div></section>`}
const graphStages=[["Machine Representation", ["Bits and Bytes", "Two's Complement", "Integer Overflow", "Floating Point Representation"]], ["Execution Model", ["Machine Code", "Assembly", "Register", "Stack Frame", "Call Stack"]], ["Memory & Pointers", ["Pointer Arithmetic", "Heap Allocation", "malloc and free", "Memory Layout", "Endianness"]], ["Defects & Undefined Behavior", ["Buffer Overflow", "Undefined Behavior", "Compiler Optimization"]], ["Toolchain & Systems", ["Linking", "Object File",   "Virtual Memory",  ]], ["Practice", ["Makefile", "Debugger"]]];const graphStagesVisible=graphStages.map(g=>[g[0],(g[1]||[]).filter(n=>conceptData[n])]).filter(g=>g[1].length);
function renderGraph(){return `<section class="slide" id="knowledge-map"><div class="eyebrow">SHARED KNOWLEDGE GRAPH</div><h2 class="section-title">九个周模块不是九段汇编片段，而是一条从位模式到操作系统边界的理解链</h2><p style="color:var(--muted);max-width:950px">点击节点查看 canonical concept。Human View 显示中文教学投影；Agent View 显示同一条记录的 canonical JSON。</p><div class="graph-grid">${graphStagesVisible.map((g,i)=>`<div class="graph-stage"><div class="num">0${i+1}</div><h3>${g[0]}</h3><div class="stage-chips">${g[1].map(conceptChip).join('')}</div></div>`).join('')}</div><div class="slide-no">3</div></section>`}
function humanWeek(w,index){const lectures=w.lectures.map(l=>`L${l.number} · ${esc(l.title)}`).join('<br>');const nodes=w.model_nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<span class="model-node">${esc(n)}</span>`).join('');const q=w.quiz;return `<div class="human-week"><div class="week-grid"><div class="stack"><div class="card"><h3>为什么学</h3><p>${esc(w.why)}</p></div><div class="card"><h3>学习目标</h3><ul>${w.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><div class="small">核心概念 · 点击查看</div><div class="concept-row">${w.concepts.map(conceptChip).join('')}</div></div></div><div class="stack"><div class="card"><h3>${esc(w.model_title)}</h3><div class="model-flow">${nodes}</div></div><div class="card"><h3>实际例子</h3><p>${esc(w.example)}</p></div><div class="card"><h3>常见误区 / 失败条件</h3><ul>${w.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div><div class="card quiz-card"><h3>Quick Check</h3><p><strong>${esc(q.q)}</strong></p>${q.choices.map((c,i)=>`<button class="quiz-option" data-week="${w.id}" data-index="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}<div id="feedback-${w.id}" class="quiz-feedback"></div></div><div class="footer">Source anchors:<br>${lectures}<br>Coursework: ${(w.assignment_ties||[]).map(x=>esc(x.toUpperCase())).join(' · ')||'—'}</div></div>`}
function agentWeek(w){const sources={lectures:w.lectures,assignment_ties:(w.assignment_ties||[]).join(' · '),evidence_status:w.evidence_status||''};return `<div class="agent-week"><div class="agent-grid"><div class="card"><h3>Week Agent Contract</h3><pre class="json-box">${jesc(w.agent)}</pre></div><div class="card"><h3>Evidence Binding</h3><pre class="json-box">${jesc(sources)}</pre></div></div><div class="card" style="margin-top:14px"><h3>Referenced canonical concepts</h3><div class="concept-row">${w.concepts.map(conceptChip).join('')}</div></div></div>`}
function renderWeek(w,i){return `<section class="slide week" id="${w.id}"><div class="week-head"><div><div class="eyebrow">${esc(w.label)} · SEE OFFICIAL · ARCHIVE OFFICIAL · ${esc(w.part)}</div><h2>${esc(w.title)}</h2><div class="lecture-meta">${w.lectures.map(l=>`Lecture ${l.number} · ${esc(l.title)}`).join(' &nbsp;|&nbsp; ')}</div></div><button class="status-btn" data-week="${w.id}">未开始</button></div><div class="big-question">${esc(w.question)}</div>${humanWeek(w,i)}${agentWeek(w)}<div class="slide-no">${i+4}</div></section>`}
function renderSynthesis(){return `<section class="slide" id="synthesis"><div class="eyebrow">COURSE SYNTHESIS · SEE OFFICIAL · ARCHIVE OFFICIAL</div><h2 class="section-title">学完 CS107 的标志：看到 C 代码能推出它在内存和机器上的真实行为</h2><div class="synthesis-grid"><div class="card"><h3>Representation</h3><p>能解释整数、浮点、指针的位级表示，以及溢出与精度陷阱。</p></div><div class="card"><h3>Execution</h3><p>能把函数调用、栈帧与汇编对应起来，定位内存与指针缺陷。</p></div><div class="card"><h3>Systems</h3><p>理解堆管理、虚存与缓存的分层，知道性能与安全问题的系统根源（缓冲区溢出、未定义行为、局部性）。</p></div></div></section>`}
function renderCourse(){renderNav();document.getElementById('main').innerHTML=renderOverview()+renderMethod()+renderGraph()+courseIR.weeks.map((w,i)=>renderWeek(w,i)).join('')+renderSynthesis();bindAll();updateProgress();setMode(mode)}
function bindAll(){document.querySelectorAll('.concept-chip').forEach(b=>b.onclick=()=>renderConcept(b.dataset.concept));document.querySelectorAll('.status-btn').forEach(b=>b.onclick=()=>{const id=b.dataset.week;state[id].status=state[id].status==='not_started'?'learned':state[id].status==='learned'?'not_started':'learned';updateProgress()});document.querySelectorAll('.quiz-option').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.week,idx=+btn.dataset.index,q=quizzes[id],box=btn.closest('.quiz-card');box.querySelectorAll('.quiz-option').forEach(x=>x.classList.remove('correct','wrong'));const fb=document.getElementById('feedback-'+id);if(idx===q.correct){btn.classList.add('correct');fb.textContent='✓ 正确。'+q.explain;state[id].quiz='pass';state[id].status='passed'}else{btn.classList.add('wrong');fb.textContent='还不对。'+q.explain;state[id].quiz='fail';if(state[id].status==='not_started')state[id].status='learned'}updateProgress()})}
function setMode(m){mode=m;storage.setItem('cs107-see-mode',m);document.body.classList.toggle('agent-mode',m==='agent');document.getElementById('human-mode').classList.toggle('active',m==='human');document.getElementById('agent-mode').classList.toggle('active',m==='agent');document.getElementById('drawer-mode-label').textContent=m==='human'?'HUMAN VIEW · 定义 / 误区 / 例子':'AGENT VIEW · canonical concept JSON';const t=document.getElementById('concept-title').textContent;if(conceptData[t])renderConcept(t)}
document.getElementById('human-mode').onclick=()=>setMode('human');document.getElementById('agent-mode').onclick=()=>setMode('agent');
function renderConcept(name){const c=conceptData[name];if(!c)return;document.getElementById('concept-title').textContent=name;const body=document.getElementById('concept-body');if(mode==='human'){body.innerHTML=`<p><strong>定义：</strong>${esc(c.definition)}</p><p><strong>为什么重要：</strong>${esc(c.why)}</p><p><strong>失败条件：</strong>${esc(c.failure_conditions)}</p><p><strong>例子：</strong>${esc(c.example)}</p><p><strong>课程位置：</strong>${(c.weeks||[]).map(esc).join('、')}</p><p><strong>证据锚点：</strong>${(c.source_weeks||[]).map(esc).join('、')}</p><div><strong>关系：</strong><div class="rel-list">${relButtons(c)}</div></div>`}else{body.innerHTML=`<pre class="json-box">${jesc(c)}</pre>`}document.querySelectorAll('.drawer .concept-chip').forEach(b=>b.onclick=()=>renderConcept(b.dataset.concept))}
function updateProgress(){let passed=0;for(const w of courseIR.weeks){const s=state[w.id],b=document.querySelector(`.status-btn[data-week="${w.id}"]`);if(!b)continue;b.className='status-btn';if(s.status==='passed'){b.textContent='已通过小测';b.classList.add('passed');passed++}else if(s.status==='learned'){b.textContent='已学习';b.classList.add('learned')}else b.textContent='未开始'}const pct=Math.round(passed/courseIR.weeks.length*100);document.getElementById('progress-bar').style.width=pct+'%';document.getElementById('progress-text').textContent=`${passed} / ${courseIR.weeks.length} 周通过小测 · ${pct}%`;storage.setItem('cs107-see-state',JSON.stringify(state))}
renderCourse();

</script>
</body>
</html>
