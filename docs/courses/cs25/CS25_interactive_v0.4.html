<script>
const data=JSON.parse(document.getElementById("cs25-data").textContent);
const app=document.getElementById("app"), drawer=document.getElementById("drawer");
const themes=(data.course_ir.themes||[]).map(t=>({id:t.id,concepts:t.concepts||[]}));
const talks=data.course_ir.talks||[];
themes.forEach(t=>{
 let s=document.createElement("section");s.className="cluster";
 s.innerHTML="<h2>"+t.id+"</h2>";
 talks.filter(x=>x.theme===t.id).forEach(x=>{
   s.innerHTML+="<div class='talk'>"+x.title+" | "+x.speaker+" | "+(x.edition||"")+" | "+(x.status||"")+"</div>";
 });
 t.concepts.forEach(name=>{
   if(!data.concepts[name]) return;
   let b=document.createElement("span");b.className="chip";b.textContent=name;
   b.onclick=()=>show(name);s.appendChild(b);
 });
 app.appendChild(s);
});
function show(name){
 let x=data.concepts[name]; if(!x) return;
 drawer.style.display="block";
 drawer.innerHTML="<h2>"+name+"</h2><h3>Human View</h3><p>"+(x.definition||"")+"</p><p>"+(x.why||"")+"</p><p>"+(x.example||"")+"</p><h3>Agent View</h3><pre>"+JSON.stringify(x,null,2)+"</pre>";
}

</script></body></html>
